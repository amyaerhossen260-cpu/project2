<script>
(function(){
'use strict';

/* ============================================================
   PRICING MODEL
   ------------------------------------------------------------
   Coin #1  → +0.001%   (price × 1.00001)
   Coin #2  → +0.002%
   ...
   Coin #10 → +0.010%
   ...
   Coin #100 → +0.100%  (price × 1.001)
   Coin #101 and beyond → +৳1 per coin (linear)
   
   Starting price ৳10  →  after 100 coins ≈ ৳10.52  →  after 250,000 ≈ ৳249,910
   ============================================================ */
const TOTAL_SUPPLY   = 250000;
const BDT_PER_USD    = 122;
const BASE_PRICE     = 10;
const GROWTH_CAP     = 100;
const PER_COIN_UNIT  = 0.00001;
const FIXED_AFTER    = 1;

// Precompute price & cumulative cost arrays
const PRICES  = new Float64Array(TOTAL_SUPPLY + 1);
const CUMCOST = new Float64Array(TOTAL_SUPPLY + 1);
PRICES[0]  = BASE_PRICE;
CUMCOST[0] = 0;
for (let i = 1; i <= TOTAL_SUPPLY; i++) {
  CUMCOST[i] = CUMCOST[i-1] + PRICES[i-1];
  if (i <= GROWTH_CAP) {
    PRICES[i] = PRICES[i-1] * (1 + i * PER_COIN_UNIT);
  } else {
    PRICES[i] = PRICES[i-1] + FIXED_AFTER;
  }
}

function priceBdt(sold){
  if (sold <= 0) return BASE_PRICE;
  if (sold >= TOTAL_SUPPLY) return PRICES[TOTAL_SUPPLY];
  const i = Math.floor(sold), fr = sold - i;
  return PRICES[i] * (1 - fr) + PRICES[i+1] * fr;
}
function priceUsd(sold){ return priceBdt(sold) / BDT_PER_USD; }
function cumCost(sold){
  if (sold <= 0) return 0;
  if (sold >= TOTAL_SUPPLY) return CUMCOST[TOTAL_SUPPLY];
  const i = Math.floor(sold), fr = sold - i;
  return CUMCOST[i] + PRICES[i] * fr;
}
function costOf(utc, sold){ return cumCost(sold + utc) - cumCost(sold); }
function solveBuy(bdt, sold){
  if (bdt <= 0) return 0;
  const start = cumCost(sold);
  let lo = 0, hi = TOTAL_SUPPLY - sold;
  for (let it = 0; it < 70; it++){
    const mid = (lo + hi) / 2;
    if (cumCost(sold + mid) - start <= bdt) lo = mid; else hi = mid;
    if (hi - lo < 1e-9) break;
  }
  return lo;
}
function solveSell(utc, sold){
  if (utc <= 0) return 0;
  return cumCost(sold) - cumCost(Math.max(0, sold - utc));
}

function shortBdt(n){

  if(abs>=1)   return '৳'+(+n.toFixed(4));
  return '৳'+(+n.toFixed(6));
}
function shortUsd(n){

  if(abs>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(abs>=1e3) return '$'+(n/1e3).toFixed(2)+'K';

}

const TFS=['1H','24H','7D','1M','ALL'];
let tf='24H';
function series(tfKey){
  const hist=store.market.priceHistory;
  const N={'1H':40,'24H':60,'7D':70,'1M':80,'ALL':100}[tfKey]||60;
  const span={'1H':36e5,'24H':DAY,'7D':7*DAY,'1M':30*DAY,'ALL':Math.max(DAY,(hist[hist.length-1].t-hist[0].t))}[tfKey]||DAY;
  const now=NOW(),start=now-span,pts=[];
  let last=hist[0].p;
  for(let i=0;i<N;i++){
    const t=start+(span*i)/(N-1);let v=last;
    for(let j=0;j<hist.length;j++){
      if(hist[j].t<=t){v=hist[j].p}
      else{const prev=hist[j-1];const f2=(t-prev.t)/(hist[j].t-prev.t||1);v=prev.p+(hist[j].p-prev.p)*f2;break}
    }
    pts.push({t,p:v});
  }
  if(pts.length)pts[pts.length-1].p=priceBdt(store.market.soldSupply);
  return pts;
}
function drawChart(){

  const mn=Math.min(...d),mx=Math.max(...d);
  const pad=(mx-mn)*.12 || Math.max(0.0001, mn*0.0001);
  const lo=mn-pad, hi=mx+pad;
  const X=i=>pl+i*(W-pl-pr)/(d.length-1),Y=v=>pt+(hi-v)/(hi-lo)*(H-pt-pb);
  let line='',area='';
  d.forEach((v,i)=>{line+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)});
  area=line+`L${X(d.length-1)} ${H-pb}L${X(0)} ${H-pb}Z`;
  let grid='';
  for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=Y(v);grid+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${shortBdt(v)}</text>`}
  const lab={'1H':['-60m','-45m','-30m','-15m','now'],'24H':['-24h','-18h','-12h','-6h','now'],'7D':['-7d','-5d','-3d','-1d','now'],'1M':['-30d','-22d','-15d','-7d','now'],'ALL':['Start','','','','now']}[tf];
  let xl='';
  lab.forEach((t,i)=>{xl+=`<text x="${pl+i*(W-pl-pr)/4}" y="${H-6}" text-anchor="${i==0?'start':i==4?'end':'middle'}">${t}</text>`});
  el.innerHTML=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>${grid}${xl}<path class="ar" d="${area}"/><path class="ln" d="${line}"/><g id="tip" style="display:none"><line id="tl" class="gl" y1="${pt}" y2="${H-pb}" style="stroke:var(--gold)"/><circle id="tc" r="4" style="fill:var(--gold)"/><text id="tt" text-anchor="middle"></text></g>`;
  el.onpointermove=e=>{
    const rc=el.getBoundingClientRect(),x=(e.clientX-rc.left)/rc.width*W;
    const i=Math.max(0,Math.min(d.length-1,Math.round((x-pl)/((W-pl-pr)/(d.length-1)))));
    const g=$('#tip',el);g.style.display='';$('#tl',el).setAttribute('x1',X(i));$('#tl',el).setAttribute('x2',X(i));
    $('#tc',el).setAttribute('cx',X(i));$('#tc',el).setAttribute('cy',Y(d[i]));
    const tt=$('#tt',el);tt.setAttribute('x',Math.min(W-50,Math.max(pl+30,X(i))));tt.setAttribute('y',Math.max(pt+10,Y(d[i])-10));tt.textContent=shortBdt(d[i]);
  };
  el.onpointerleave=()=>{const g=$('#tip',el);if(g)g.style.display='none'};
}

const F={q:'',type:'all',status:'all',sort:'new'};
function filtered(){
  const a=S();
  let l=a.tx.filter(t=>{
    if(F.type!=='all'&&t.type!==F.type)return false;
    if(F.status!=='all'&&t.status!==F.status)return false;
    if(F.q){const q=F.q.toLowerCase();if(!(t.who+' '+(t.note||'')+' '+t.id+' '+(t.cat||'')).toLowerCase().includes(q))return false}
    return true});
  l.sort((x,y)=>F.sort==='new'?y.ts-x.ts:F.sort==='old'?x.ts-y.ts:F.sort==='hi'?Math.abs(y.amt)-Math.abs(x.amt):Math.abs(x.amt)-Math.abs(y.amt));
  return l;
}
function histBody(){
  const l=filtered();

  if($('#s-to').value&&!validTo(to))m=b('ফরম্যাট সঠিক নয়','Invalid format');
  else if(to===a.addr||to.toLowerCase()===a.nick.toLowerCase()||to===a.uid)m=b('নিজের কাছে নয়','Cannot send to self');
  else if(amt+fee>a.heldCoins)m=b('KCT যথেষ্ট নয়','Insufficient KCT');
  err.textContent=m;return {amt,fee,to,err:m};
}
function maintBlock(){if(store.settings.maintenance){toast(b('মেইনটেন্যান্স','Under maintenance'));return true}return false}
function rateBlock(){
  const a=S();a.sendLog=(a.sendLog||[]).filter(t=>t>NOW()-6e4);

}

function notify(kind,msg){if(S().notif[kind])toast(msg);beep()}
function doSend(to,amt,note,cat){
  const a=S(),fee=feeOf(amt);
  a.heldCoins=r2(a.heldCoins-amt-fee);
  const r=store.users.find(u=>u!==a&&(u.uid===to||u.nick===to||u.addr===to));
  if(r){
    r.heldCoins=r2(r.heldCoins+amt);
    r.tx.push({id:txid(),type:'received',status:'Completed',ts:NOW(),amt,who:a.nick,note,cat,fee:0});
  }
  return addTx({type:'sent',amt,who:to,note,cat,fee});
}

function receipt(t){

function txDetail(id){
  const t=S().tx.find(x=>x.id===id);if(!t)return;
  let amt;
  if(t.type==='buy')amt=`+${f(t.utc)} KCT (৳${f(t.bdt)})`;
  else if(t.type==='sell')amt=`+৳${f(t.bdt)} (${f(t.utc)} KCT)`;
  else if(t.type==='deposit')amt=`+৳${f(t.bdt)}`;
  else if(t.type==='withdraw')amt=`−৳${f(t.bdt)}`;
  else amt=`${credit(t)?'+':'−'}${f(Math.abs(t.amt))} KCT`;
  modal(b('বিস্তারিত','Details'),`

/* ============ BUY/SELL PREVIEW ============ */
function previewBuy(){
  const a=S(),bdt=parseFloat($('#buy-bdt')?.value)||0;
  if(!$('#buy-utc'))return;
  const sold=store.market.soldSupply;
  const remain=TOTAL_SUPPLY-sold;
  let utc=solveBuy(bdt,sold);
  let actualBdt=bdt;
  if(utc>remain){utc=remain;actualBdt=costOf(utc,sold);}
  const avg=utc>0?actualBdt/utc:priceBdt(sold);
  const newP=priceBdt(sold+utc);
  $('#buy-utc').textContent=f(utc,4)+' KCT';
  $('#buy-avg').textContent=shortBdt(avg)+' / '+shortUsd(avg/BDT_PER_USD);
  $('#buy-newprice').textContent=shortBdt(newP)+' / '+shortUsd(newP/BDT_PER_USD);
  let err='';
  if(bdt>a.realBalance)err=b('আসল ব্যালেন্স যথেষ্ট নয়','Insufficient real balance');
  else if(utc<=0&&bdt>0)err=b('সাপ্লাই শেষ','Supply exhausted');
  $('#buy-err').textContent=err;
}
function previewSell(){
  const a=S(),utc=parseFloat($('#sell-utc')?.value)||0;
  if(!$('#sell-bdt'))return;
  const bdt=solveSell(Math.min(utc,a.heldCoins),store.market.soldSupply);
  $('#sell-bdt').textContent=shortBdt(bdt);
  $('#sell-usd').textContent=shortUsd(bdt/BDT_PER_USD);
  $('#sell-avg').textContent=shortBdt(utc>0?bdt/utc:0);
  let err='';
  if(utc>a.heldCoins)err=b('KCT যথেষ্ট নয়','Insufficient KCT');
  $('#sell-err').textContent=err;
}
function previewBuySell(){previewBuy();previewSell()}

  }
  if(e.target.id==='signupform'){
    const name=$('#su-name').value.trim(),email=$('#su-email').value.trim(),phone=$('#su-phone').value.trim(),
      country=$('#su-country').value,pw=$('#su-pw').value,pw2=$('#su-pw2').value,err=$('#su-err');
    if(name.length<2){err.textContent=b('নাম ২+','Name 2+');return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent=b('সঠিক ইমেইল','Valid email');return}
    if(!/^\d{8,15}$/.test(phone.replace(/\D/g,''))){err.textContent=b('সঠিক নম্বর','Valid phone');return}
    if(store.users.find(u=>u.phone===phone)){err.textContent=b('এই নম্বরে অ্যাকাউন্ট আছে','Account exists');return}
    if(pw.length<6){err.textContent=b('পাসওয়ার্ড ৬+','Password 6+');return}
    if(pw!==pw2){err.textContent=b('মেলে না','Not match');return}
    const u={
      name,email,phone,country,pwHash:hashPw(pw),
      realBalance:STARTING_BDT,heldCoins:0,totalBought:0,
      addr:'KCT1q'+Math.random().toString(36).slice(2,10).toUpperCase()+phone.slice(-4),
      uid:genUid(),
      color:hs(phone)%6,nick:'@'+name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12),
      bio:'',pin:null,
      verified:{email:true,phone:false,profile:false},
      contacts:[],tx:[],deposits:[],
      tips:[5,10,25],notif:{send:true,receive:true,reward:true},
      ref:{code:'KCT-'+phone.slice(-4),earn:0,count:0},
      sendLog:[]
    };
    store.users.push(u);store.session=phone;store.admin=false;save();beep();
    toast(b('স্বাগতম! আপনার ID: '+u.uid,'Welcome! Your ID: '+u.uid));
    render();return;
  }
  if(e.target.id==='binanceform'){
    const amt=parseFloat($('#bin-amt').value)||0,trx=$('#bin-trx').value.trim();
    if(!store.settings.depositsEnabled){$('#bin-err').textContent=b('ডিপোজিট বন্ধ','Deposits disabled');return}
    if(amt<1){$('#bin-err').textContent=b('সর্বনিম্ন ১ USDT','Min 1 USDT');return}
    if(!trx||trx.length<6){$('#bin-err').textContent=b('TxID দিন','Provide TxID');return}
    const bdtAmt=r2(amt*BDT_PER_USD);
    const a=S();a.deposits=a.deposits||[];
    a.deposits.push({id:depId(),method:'binance',bdt:bdtAmt,usdt:amt,trxid:trx,status:'Pending',ts:NOW()});
    save();beep();toast(b('রিকোয়েস্ট জমা','Request sent'));render();return;
  }
  if(e.target.id==='bkashform'){
    const amt=parseFloat($('#bk-amt').value)||0,trx=$('#bk-trx').value.trim();
    if(!isBdUser()){$('#bk-err').textContent=b('শুধু বাংলাদেশ','Bangladesh only');return}
    if(!store.settings.depositsEnabled){$('#bk-err').textContent=b('ডিপোজিট বন্ধ','Deposits disabled');return}
    if(amt<store.settings.minDeposit){$('#bk-err').textContent=b(`সর্বনিম্ন ৳${store.settings.minDeposit}`,`Min ৳${store.settings.minDeposit}`);return}
    if(!trx||trx.length<6){$('#bk-err').textContent=b('TrxID দিন','Provide TrxID');return}
    const a=S();a.deposits=a.deposits||[];
    a.deposits.push({id:depId(),method:'bkash',bdt:amt,trxid:trx,status:'Pending',ts:NOW()});
    save();beep();toast(b('রিকোয়েস্ট জমা','Request sent'));render();return;
  }
  if(e.target.id==='sendform'){
    if(maintBlock())return;
    const p=sendPreview();if(!p)return;
    if(!validTo(p.to)){$('#s-err').textContent=b('ফরম্যাট','Format');return}
    if(!(p.amt>0)){$('#s-err').textContent=b('পরিমাণ','Amount');return}
    if(p.err)return;
    confirmSend(p.to,p.amt,$('#s-note').value.trim(),$('#s-cat').value);
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='s-amt'||t.id==='s-to')sendPreview();
  if(t.id==='buy-bdt')previewBuy();
  if(t.id==='sell-utc')previewSell();
  if(t.dataset.f&&t.tagName==='INPUT'&&t.type!=='date'){F[t.dataset.f]=t.value;const h=$('#hist');if(h)h.innerHTML=histBody()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f){F[t.dataset.f]=t.value;const h=$('#hist');if(h)h.innerHTML=histBody();return}
  const k=t.dataset.in;if(!k)return;
  if(k==='sound')store.sound=t.checked;
  else if(k==='maint')store.settings.maintenance=t.checked;
  else if(k==='dep-en')store.settings.depositsEnabled=t.checked;
  else if(k==='bin-en')store.settings.binanceEnabled=t.checked;
  else if(k==='bk-en')store.settings.bkashEnabled=t.checked;
  else if(k==='reveal-supply')store.settings.revealSupply=t.checked;
  save();if(k==='maint'||k==='reveal-supply'||k.startsWith('dep-')||k.startsWith('bin-')||k.startsWith('bk-'))render();
});
window.addEventListener('hashchange',render);

if(!location.hash)try{history.replaceState(null,'','#home')}catch(e){}
render();
})();
</script>
</body>
</html>
